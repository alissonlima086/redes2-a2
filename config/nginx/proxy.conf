upstream moodle_backend {
    
    # ip_hash;
    hash $http_x_forwarded_for consistent;

    server 192.168.56.20:80 max_fails=3 fail_timeout=30s;
    server 192.168.56.30:80 max_fails=3 fail_timeout=30s;
    server 192.168.56.40:80 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/proxy_access.log;
    error_log  /var/log/nginx/proxy_error.log;

    client_max_body_size 128M;

    location / {
        proxy_pass         http://moodle_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  60s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;

        add_header X-Upstream-Addr   $upstream_addr   always;
        add_header X-Upstream-Status $upstream_status always;
    }

    location /nginx_status {
        stub_status on;
        allow 192.168.56.0/24;
        allow 127.0.0.1;
        deny all;
    }
}
